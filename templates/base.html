<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {{ title or "FitBuddy" }}
    </title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>

<body>

    <header class="navbar">

        <div class="brand">
            <span class="brand-icon">💪</span>
            <span>FitBuddy</span>
        </div>

        <nav>
            <a href="/">Home</a>
            <a href="/view-all-users">Admin</a>
            <a href="/docs">API Docs</a>
        </nav>

    </header>


    <main class="page-container">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="footer">

        <p>
            FitBuddy — AI Fitness Plan Generator
        </p>

        <p class="small">
            General fitness information only. Consult a qualified
            professional for medical or exercise-specific advice.
        </p>

    </footer>

</body>

</html>
